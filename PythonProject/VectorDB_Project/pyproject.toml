[project]
name = "vectordb-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Premkumar-DataEngineer", email = "premkumarap941@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.26.0",
    "pgvector>=0.5.1",
    "psycopg2-binary>=2.9.13",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
]

[project.scripts]
vectordb-project = "vectordb_project:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
